<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#3761e9" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Daily English · 每日口语</title>
  <style>
    :root{--ink:#17223b;--muted:#6d7890;--paper:#fffdf8;--blue:#3761e9;--mint:#dff8ec;--line:#e8eaf1;--warm:#ffca6a}*{box-sizing:border-box}body{margin:0;background:#f4f7ff;color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif}.app{max-width:960px;margin:auto;min-height:100vh;padding:28px 22px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{font-size:20px;font-weight:800;letter-spacing:-.4px}.brand span{color:var(--blue)}.streak{background:#fff;border-radius:99px;padding:9px 13px;font-size:13px;box-shadow:0 5px 18px #223c8512}.hero{background:linear-gradient(120deg,#3761e9,#6785f6);border-radius:27px;padding:29px 32px;color:#fff;position:relative;overflow:hidden}.hero:after{content:"Aa";position:absolute;right:28px;bottom:-35px;font-family:Georgia;font-size:170px;font-style:italic;color:#fff2}.eyebrow{font-size:13px;opacity:.78}.hero h1{font-size:clamp(26px,5vw,39px);margin:8px 0;letter-spacing:-1.5px}.hero p{margin:0;opacity:.88}.progress{width:210px;height:8px;background:#ffffff3b;border-radius:9px;margin-top:21px}.progress i{display:block;width:46%;height:100%;background:var(--warm);border-radius:9px}.section-title{display:flex;align-items:end;justify-content:space-between;margin:31px 0 14px}.section-title h2{margin:0;font-size:20px}.section-title button,.translate{border:0;background:none;color:var(--blue);font-weight:700;cursor:pointer}.scenes{display:flex;gap:11px;overflow:auto;padding:2px 1px 8px}.scene{min-width:150px;background:#fff;border:2px solid transparent;padding:16px;border-radius:17px;cursor:pointer;text-align:left;color:var(--ink);box-shadow:0 5px 16px #1c35600a}.scene.active{border-color:var(--blue);background:#eff3ff}.scene .emoji{font-size:25px;display:block;margin-bottom:9px}.scene b{display:block;font-size:15px}.scene small{color:var(--muted);font-size:12px}.review{background:#fff;border-radius:20px;padding:17px 19px;margin:22px 0 5px;border:1px solid #e8eaf1;display:flex;justify-content:space-between;gap:15px;align-items:center}.review b{display:block}.review p{margin:5px 0 0;color:var(--muted);font-size:13px}.review button,.done{border:0;border-radius:12px;background:var(--blue);color:#fff;padding:10px 13px;font-weight:800;cursor:pointer;white-space:nowrap}.dialogue{background:var(--paper);border-radius:24px;padding:23px;margin-top:4px;box-shadow:0 9px 26px #1c35600c}.dialogue-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}.dialogue-head b{font-size:18px}.play-all{border:0;border-radius:12px;background:var(--mint);color:#18774c;padding:10px 13px;font-weight:800;cursor:pointer}.line{display:grid;grid-template-columns:42px 1fr 36px;gap:11px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}.line:last-child{border:0}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff0cf;font-size:20px}.line:nth-of-type(even) .avatar{background:#e4eaff}.speaker{font-size:12px;color:var(--muted);font-weight:800}.english{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:20px;margin:3px 0 5px}.word{font:inherit;color:inherit;border:0;background:transparent;padding:1px 2px;border-radius:5px;cursor:pointer}.word:hover,.word:focus,.word.playing{color:#204dcc;background:#dfe8ff;outline:0}.phonetic{color:#3863bc;font-family:Georgia,serif;font-size:15px;letter-spacing:.2px}.chinese{font-size:13px;color:var(--muted);margin-top:5px}.hidden{display:none}.speak{border:0;background:#f0f3f9;border-radius:10px;width:35px;height:35px;font-size:16px;cursor:pointer}.tip{display:flex;gap:12px;background:#fff2d7;border-radius:16px;padding:15px 17px;margin-top:18px;font-size:14px;line-height:1.6}.tip strong{color:#a66400}.done{display:block;width:100%;margin-top:16px;background:#17223b}.done.finished{background:#2aa369}.bottom{position:sticky;bottom:12px;margin:25px auto 0;width:max-content;max-width:100%;background:#17223b;color:#fff;border-radius:15px;padding:11px 18px;font-size:13px;box-shadow:0 7px 21px #17223b33}@media(max-width:550px){.app{padding:18px 14px}.hero{padding:25px 22px}.hero:after{right:8px}.dialogue{padding:17px}.english{font-size:18px}.line{grid-template-columns:38px 1fr 34px;gap:8px}}
    .recall .english,.recall .phonetic{filter:blur(7px);user-select:none}.recall .english{cursor:pointer}.recall .chinese{font-size:15px;color:var(--ink);font-weight:700}
  </style>
</head>
<body><main class="app">
  <header class="top"><div class="brand">Daily <span>English</span></div><div class="streak">🔥 连续学习 3 天</div></header>
  <section class="hero"><div class="eyebrow" id="dayLabel">DAY 1 · TODAY'S MINI LESSON</div><h1 id="heroTitle">用英语，自信开口。</h1><p id="heroText">今天先记住 30%，再用回忆练习巩固 70%。</p><div class="progress"><i></i></div></section>
  <div class="section-title"><h2>选择一个场景</h2><button id="translation">隐藏中文</button></div>
  <nav class="scenes" id="scenes"></nav>
  <section class="review" id="reviewCard"></section>
  <section class="dialogue"><div class="dialogue-head"><div><b id="dialogueTitle">认识新朋友</b><div class="speaker" id="modeHint">记忆模式 · 看英文、听发音</div></div><button class="play-all" id="modeBtn">进入回忆练习</button></div><div id="lines"></div><div class="tip"><span>💡</span><div><strong id="tipTitle">30% 记忆输入</strong><br><span id="tip">先听一遍，再按暂停逐句模仿。不要害怕说错！</span></div></div><button class="done" id="doneBtn">✓ 我学完了，明天复习</button></section>
  <div class="bottom">今日已练习 2 / 5 句 · 继续加油 ✨</div>
</main>
<script>
const lessons=[
{name:'认识朋友',sub:'问候与介绍',emoji:'👋',title:'认识新朋友',tip:'见面时，先微笑再说 “Hi”。语速放慢会显得更自然。',lines:[['Lily','👩','Hi! Nice to meet you.','/haɪ/ /naɪs tə miːt juː/','你好！很高兴认识你。'],['Tom','👨','Nice to meet you, too.','/naɪs tə miːt juː tuː/','我也很高兴认识你。'],['Lily','👩','What is your name?','/wʌt ɪz jɔːr neɪm/','你叫什么名字？'],['Tom','👨','My name is Tom.','/maɪ neɪm ɪz tɒm/','我叫汤姆。']]},
{name:'咖啡店',sub:'点单与付款',emoji:'☕',title:'在咖啡店',tip:'点单时用 “I would like...” 比 “I want...” 更礼貌。',lines:[['Amy','👩','Hi, I would like a coffee, please.','/haɪ, aɪ wʊd laɪk ə ˈkɒfi pliːz/','你好，我想要一杯咖啡，谢谢。'],['Barista','🧑‍🍳','Sure. Hot or iced?','/ʃʊr. hɒt ɔːr aɪst/','好的。热的还是冰的？'],['Amy','👩','Hot, please. How much is it?','/hɒt pliːz. haʊ mʌtʃ ɪz ɪt/','热的，谢谢。多少钱？'],['Barista','🧑‍🍳','It is three dollars.','/ɪt ɪz θriː ˈdɒlərz/','三美元。']]},
{name:'问路',sub:'寻求帮助',emoji:'🗺️',title:'向路人问路',tip:'找陌生人问路时，先说 “Excuse me” 来礼貌地引起注意。',lines:[['You','🙂','Excuse me, where is the station?','/ɪkˈskjuːz miː, weər ɪz ðə ˈsteɪʃən/','打扰一下，车站在哪里？'],['Local','🧑','Go straight and turn left.','/ɡəʊ streɪt ænd tɜːn left/','一直走，然后左转。'],['You','🙂','Thank you very much.','/θæŋk juː ˈveri mʌtʃ/','非常感谢你。'],['Local','🧑','You are welcome.','/juː ɑːr ˈwelkəm/','不客气。']]},
{name:'买东西',sub:'商店购物',emoji:'🛍️',title:'在商店购物',tip:'问价格最常用的一句是 “How much is this?”。',lines:[['You','🙂','How much is this shirt?','/haʊ mʌtʃ ɪz ðɪs ʃɜːt/','这件衬衫多少钱？'],['Clerk','🧑‍💼','It is twenty dollars.','/ɪt ɪz ˈtwenti ˈdɒlərz/','二十美元。'],['You','🙂','Can I try it on?','/kæn aɪ traɪ ɪt ɒn/','我可以试穿吗？'],['Clerk','🧑‍💼','Of course. The fitting room is there.','/ɒv kɔːs. ðə ˈfɪtɪŋ ruːm ɪz ðeər/','当然可以。试衣间在那边。']]},
{name:'餐厅',sub:'点餐交流',emoji:'🍜',title:'在餐厅点餐',tip:'“I would like” 是初学者最实用、也最礼貌的点餐表达。',lines:[['Server','🧑‍🍳','Are you ready to order?','/ɑːr juː ˈredi tə ˈɔːdər/','您准备好点餐了吗？'],['You','🙂','Yes, I would like some noodles.','/jes, aɪ wʊd laɪk sʌm ˈnuːdəlz/','是的，我想要一些面条。'],['Server','🧑‍🍳','Anything to drink?','/ˈeniθɪŋ tə drɪŋk/','要喝点什么吗？'],['You','🙂','Just water, please.','/dʒʌst ˈwɔːtər pliːz/','只要水，谢谢。']]},
{name:'时间',sub:'约时间见面',emoji:'🕒',title:'约朋友见面',tip:'约时间时，把具体时间说清楚，对方更容易理解。',lines:[['You','🙂','Are you free this afternoon?','/ɑːr juː friː ðɪs ˌæftərˈnuːn/','你今天下午有空吗？'],['Friend','🧑','Yes, I am free at three.','/jes, aɪ æm friː æt θriː/','有，我三点有空。'],['You','🙂','Great. See you then.','/ɡreɪt. siː juː ðen/','太好了。到时见。'],['Friend','🧑','See you!','/siː juː/','再见！']]},
{name:'天气',sub:'轻松聊天',emoji:'☀️',title:'聊聊天气',tip:'天气是最安全、最常见的英语开场话题。',lines:[['You','🙂','It is a beautiful day.','/ɪt ɪz ə ˈbjuːtɪfəl deɪ/','今天天气真好。'],['Friend','🧑','Yes, it is warm and sunny.','/jes, ɪt ɪz wɔːm ænd ˈsʌni/','是啊，温暖又晴朗。'],['You','🙂','I like this weather.','/aɪ laɪk ðɪs ˈweðər/','我喜欢这样的天气。'],['Friend','🧑','Me too.','/miː tuː/','我也是。']]},
{name:'电话',sub:'简单通话',emoji:'📱',title:'打电话',tip:'接电话时，先说自己的名字，会显得清楚又礼貌。',lines:[['You','🙂','Hello, this is Amy speaking.','/həˈləʊ, ðɪs ɪz ˈeɪmi ˈspiːkɪŋ/','你好，我是艾米。'],['Friend','🧑','Hi Amy, this is Ben.','/haɪ ˈeɪmi, ðɪs ɪz ben/','嗨艾米，我是本。'],['You','🙂','How are you today?','/haʊ ɑːr juː təˈdeɪ/','你今天怎么样？'],['Friend','🧑','I am doing well, thanks.','/aɪ æm ˈduːɪŋ wel, θæŋks/','我很好，谢谢。']]}
];
const courseStart=localStorage.getItem('dailyEnglishCourseStart')||new Date().toISOString().slice(0,10);localStorage.setItem('dailyEnglishCourseStart',courseStart);
const courseDay=()=>Math.max(1,Math.floor((new Date().setHours(0,0,0,0)-new Date(courseStart).getTime())/86400000)+1);
const dailyLesson=()=>((courseDay()-1)%lessons.length);
let current=dailyLesson(),showChinese=true,playing=false,recallMode=false;
const $=s=>document.querySelector(s);
const today=()=>new Date().toISOString().slice(0,10);
function history(){return JSON.parse(localStorage.getItem('dailyEnglishHistory')||'[]')}
function renderReview(){const due=history().filter(x=>x.reviewDate<=today()&&!x.reviewed);$('#reviewCard').innerHTML=due.length?`<div><b>🔁 今日复习 · ${due.length} 个场景</b><p>复习昨天学过的内容，记得会更牢。</p></div><button onclick="startReview()">开始复习</button>`:`<div><b>🔁 复习计划</b><p>今天完成学习后，内容会在明天自动提醒你复习。</p></div>`}
function words(sentence){return sentence.split(/(\s+)/).map(part=>/^\s+$/.test(part)?part:`<button class="word" onclick="sayWord(this, '${part.replace(/[^A-Za-z'-]/g,'')}' )">${part}</button>`).join('')}
function render(){let L=lessons[current],todayIndex=dailyLesson(),todayLesson=lessons[todayIndex];$('#dayLabel').textContent=`DAY ${courseDay()} · 每日 5 分钟课程`;$('#heroTitle').textContent=current===todayIndex?`第 ${courseDay()} 天：${todayLesson.name}`:'复习昨天的内容';$('#heroText').textContent=current===todayIndex?'先看和听 30%，再用回忆练习巩固 70%。':'主动想起，比重复阅读更能记牢。';$('#scenes').innerHTML=`<button class="scene active" onclick="goToday()"><span class="emoji">${todayLesson.emoji}</span><b>今日新课：${todayLesson.name}</b><small>${todayLesson.sub} · 第 ${courseDay()} 天</small></button>`;$('#dialogueTitle').textContent=(current===todayIndex?'今日课程 · ':'复习课程 · ')+L.title;$('#tip').textContent=recallMode?'只看中文，先在心里或大声说出英文；想不起来时，点击模糊的英文查看。':L.tip;$('#tipTitle').textContent=recallMode?'70% 回忆输出':'30% 记忆输入';$('#modeHint').textContent=recallMode?'回忆模式 · 看中文，说英文':'记忆模式 · 看英文、听发音';$('#modeBtn').textContent=recallMode?'回到记忆模式':'进入 70% 回忆练习';$('#lines').innerHTML=L.lines.map((x,i)=>`<article class="line ${recallMode?'recall':''}"><div class="avatar">${x[1]}</div><div><div class="speaker">${x[0]}</div><div class="english" onclick="this.closest('.line').classList.remove('recall')">${words(x[2])}</div><div class="phonetic">${x[3]}</div><div class="chinese ${showChinese?'':'hidden'}">${x[4]}</div></div><button class="speak" aria-label="朗读" onclick="say(${i})">🔊</button></article>`).join('');$('#translation').textContent=showChinese?'隐藏中文':'显示中文';const completed=history().some(x=>x.lesson===current&&x.doneDate===today());$('#doneBtn').textContent=completed?'✓ 今天已完成，明天见！':'✓ 我学完了，明天复习';$('#doneBtn').className='done '+(completed?'finished':'');renderReview()}
function choose(i){current=i;recallMode=false;render()}function goToday(){current=dailyLesson();recallMode=false;render()}
function speak(text,rate=.72){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;speechSynthesis.speak(u)}
function say(i){speak(lessons[current].lines[i][2])}
function sayWord(button,word){if(!word)return;document.querySelectorAll('.word.playing').forEach(x=>x.classList.remove('playing'));button.classList.add('playing');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.62;u.onend=()=>button.classList.remove('playing');speechSynthesis.speak(u)}
function startReview(){const h=history();const record=h.find(x=>x.reviewDate<=today()&&!x.reviewed);if(!record)return;current=record.lesson;record.reviewed=true;localStorage.setItem('dailyEnglishHistory',JSON.stringify(h));render();window.scrollTo({top:document.querySelector('.dialogue').offsetTop-12,behavior:'smooth'})}
$('#translation').onclick=()=>{showChinese=!showChinese;render()};$('#modeBtn').onclick=()=>{recallMode=!recallMode;render()};
$('#doneBtn').onclick=()=>{let h=history();if(!h.some(x=>x.lesson===current&&x.doneDate===today())){let d=new Date();d.setDate(d.getDate()+1);h.push({lesson:current,doneDate:today(),reviewDate:d.toISOString().slice(0,10),reviewed:false});localStorage.setItem('dailyEnglishHistory',JSON.stringify(h))}render()};
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
