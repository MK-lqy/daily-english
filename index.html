const sounds='点击英文单词，单独听发音';
function extraLesson(group,item,n){
 const [name,sub,emoji]=group, [en,zh]=item.split('|'), A=['You','🙂'],B=['Helper','🧑'];
 const hint='每一句都可点单词单独听，再用回忆模式自己说出来。';
 const sets={
  '咖啡店':[[`I would like ${en}, please.`,`我想要${zh}，谢谢。`],[`Sure. Would you like it hot or iced?`,'好的。您想要热的还是冰的？'],['Iced, please. How much is it?','冰的，谢谢。多少钱？'],['It will be ready in a moment.','马上就好。']],

  '问路':[[`Excuse me, where is the ${en}?`,`打扰一下，${zh}在哪里？`],[`Go straight. It is near here.`,'一直走。就在这附近。'],['Is it far from here?','离这里远吗？'],['No, it is only a few minutes away.','不远，只要几分钟。']],
  '交通':[[`How can I get to the ${en}?`,`我怎么去${zh}？`],['You can take the bus or the subway.','您可以坐公交或地铁。'],['Which stop should I get off at?','我应该在哪一站下车？'],[`Get off at the next stop for the ${en}.`,`下一站下车就到${zh}。`]],
  '酒店':[[`Could I have ${en}?`,`我可以要${zh}吗？`],['Certainly. I can help you with that.','当然，我可以帮您。'],['Thank you. When can I get it?','谢谢。我什么时候可以拿到？'],['I will arrange it right away.','我马上为您安排。']],
  '旅行':[[`Where can I get ${en}?`,`我在哪里可以拿到${zh}？`],['Please go to the travel desk.','请去旅行服务台。'],['Is it open now?','现在开着吗？'],['Yes, it is open until six.','是的，营业到六点。']],
  '学校':[[`I need help with ${en}.`,`我需要${zh}方面的帮助。`],['Sure. Let us look at it together.','好的。我们一起看看。'],['Thank you. I want to learn more.','谢谢。我想多学一点。'],['You are doing a great job.','你做得很好。']],
  '工作':[[`Can you help me with ${en}?`,`你能帮我处理${zh}吗？`],['Yes. Let us discuss it now.','可以。我们现在讨论一下。'],['When do you need it?','你什么时候需要？'],['Please send it to me this afternoon.','请今天下午发给我。']],
  '健康':[[`I need help with ${en}.`,`我需要处理${zh}。`],['I understand. Please tell me more.','我明白。请再多说一点。'],['What should I do now?','我现在该怎么办？'],['Please rest and follow the doctor’s advice.','请休息并遵从医生建议。']],
  '运动':[[`I would like to try ${en}.`,`我想试试${zh}。`],['Great choice. It starts at five.','很好的选择。五点开始。'],['Do I need to bring anything?','我需要带什么吗？'],['Please bring water and comfortable shoes.','请带水和舒适的鞋。']],
  '家里':[[`I need to ${en}.`,`我需要${zh}。`],['Would you like some help?','你需要帮忙吗？'],['Yes, please. Thank you.','需要，谢谢。'],['No problem. We can do it together.','没问题。我们可以一起做。']],
  '朋友':[[`Would you like to ${en}?`,`你想一起${zh}吗？`],['That sounds great. What time?','听起来不错。几点？'],['How about three o’clock?','三点怎么样？'],['Perfect. See you then.','太好了。到时见。']],
  '电话':[[`I am calling to ${en}.`,`我打电话是想${zh}。`],['Thanks for calling. How can I help?','谢谢来电。我可以怎么帮您？'],['That is all for now.','目前就这些。'],['Have a nice day. Goodbye.','祝您愉快。再见。']],
  '科技':[[`I need help with ${en}.`,`我需要${zh}方面的帮助。`],['Let me check it for you.','让我为您检查一下。'],['Thank you. Is it easy to fix?','谢谢。容易修好吗？'],['Yes, we can fix it quickly.','是的，我们能很快解决。']],
  '银行':[[`I would like to ${en}.`,`我想${zh}。`],['Please show me your ID, please.','请出示您的身份证件。'],['Here it is. Thank you.','给您，谢谢。'],['You are welcome. It is all set.','不客气。已经办好了。']],
  '邮局':[[`I need to ${en}.`,`我需要${zh}。`],['Certainly. Please put it here.','当然。请放在这里。'],['How much will it cost?','需要多少钱？'],['I will check the price for you.','我来为您查一下价格。']],
  '天气':[[`What do you think about ${en}?`,`你觉得${zh}怎么样？`],['It looks nice today.','今天看起来不错。'],['Should I bring an umbrella?','我应该带伞吗？'],['It is a good idea, just in case.','带上比较好，以防万一。']],
  '活动':[[`Would you like to go to ${en}?`,`你想去${zh}吗？`],['Yes, I would love to.','好啊，我很想去。'],['When does it start?','什么时候开始？'],['It starts at seven this evening.','今晚七点开始。']],
  '宠物':[[`My pet needs ${en}.`,`我的宠物需要${zh}。`],['I can help you with that.','我可以帮您。'],['What do you recommend?','您推荐什么？'],['Let us choose the best option together.','我们一起选最合适的。']],
  '邻里':[[`Do you know where I can find ${en}?`,`你知道哪里能找到${zh}吗？`],['Yes, there is one around the corner.','知道，拐角处就有一个。'],['Is it open today?','今天开门吗？'],['Yes, it is open until eight.','是的，营业到八点。']],
  '紧急情况':[[`I need ${en}, please.`,`我需要${zh}，拜托。`],['Stay calm. I am here to help.','保持冷静。我在这里帮您。'],['What should I do?','我该怎么办？'],['Please stay here and wait for help.','请留在这里等待帮助。']]
 };
 return {name,sub,emoji,title:`${name} · ${zh}`,tip:hint,lines:sets[name].map((line,i)=>[...(i%2?B:A),line[0],sounds,line[1]])};
}
library.flatMap(g=>g[3].split(',').map((v,i)=>extraLesson(g,v,i))).slice(0,242).forEach(x=>lessons.push(x));
const courseStart=localStorage.getItem('dailyEnglishCourseStart')||new Date().toISOString().slice(0,10);localStorage.setItem('dailyEnglishCourseStart',courseStart);
const courseDay=()=>Math.max(1,Math.floor((new Date().setHours(0,0,0,0)-new Date(courseStart).getTime())/86400000)+1);
const dailyLesson=()=>((courseDay()-1)%lessons.length);
let current=dailyLesson(),showChinese=true,playing=false,recallMode=false;
const $=s=>document.querySelector(s);
const today=()=>new Date().toISOString().slice(0,10);
function history(){return JSON.parse(localStorage.getItem('dailyEnglishHistory')||'[]')}
function renderReview(){const due=history().filter(x=>x.reviewDate<=today()&&!x.reviewed);$('#reviewCard').innerHTML=due.length?`<div><b>🔁 今日复习 · ${due.length} 个场景</b><p>复习昨天学过的内容，记得会更牢。</p></div><button onclick="startReview()">开始复习</button>`:`<div><b>🔁 复习计划</b><p>今天完成学习后，内容会在明天自动提醒你复习。</p></div>`}
function words(sentence){return sentence.split(/(\s+)/).map(part=>/^\s+$/.test(part)?part:`<button class="word" onclick="sayWord(this, '${part.replace(/[^A-Za-z'-]/g,'')}' )">${part}</button>`).join('')}
function render(){let L=lessons[current],todayIndex=dailyLesson(),todayLesson=lessons[todayIndex];$('#dayLabel').textContent=`DAY ${courseDay()} · 每日 5 分钟课程`;$('#heroTitle').textContent=current===todayIndex?`第 ${courseDay()} 天：${todayLesson.name}`:'复习昨天的内容';$('#heroText').textContent=current===todayIndex?'先看和听 30%，再用回忆练习巩固 70%。':'主动想起，比重复阅读更能记牢。';$('#scenes').innerHTML=`<button class="scene active" onclick="goToday()"><span class="emoji">${todayLesson.emoji}</span><b>今日新课：${todayLesson.name}</b><small>${todayLesson.sub} · 第 ${courseDay()} 天</small></button>`;$('#dialogueTitle').textContent=(current===todayIndex?'今日课程 · ':'复习课程 · ')+L.title;$('#tip').textContent=recallMode?'只看中文，先在心里或大声说出英文；想不起来时，点击模糊的英文查看。':L.tip;$('#tipTitle').textContent=recallMode?'70% 回忆输出':'30% 记忆输入';$('#modeHint').textContent=recallMode?'回忆模式 · 看中文，说英文':'记忆模式 · 看英文、听发音';$('#modeBtn').textContent=recallMode?'回到记忆模式':'进入 70% 回忆练习';$('#lines').innerHTML=L.lines.map((x,i)=>`<article class="line ${recallMode?'recall':''}"><div class="avatar">${x[1]}</div><div><div class="speaker">${x[0]}</div><div class="english" onclick="this.closest('.line').classList.remove('recall')">${words(x[2])}</div><div class="phonetic">${x[3]}</div><div class="chinese ${showChinese?'':'hidden'}">${x[4]}</div></div><button class="speak" aria-label="朗读" onclick="say(${i})">🔊</button></article>`).join('');$('#translation').textContent=showChinese?'隐藏中文':'显示中文';const completed=history().some(x=>x.lesson===current&&x.doneDate===today());$('#doneBtn').textContent=completed?'✓ 今天已完成，明天见！':'✓ 我学完了，明天复习';$('#doneBtn').className='done '+(completed?'finished':'');renderReview()}
function choose(i){current=i;recallMode=false;render()}function goToday(){current=dailyLesson();recallMode=false;render()}
function speak(text,rate=.72){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;speechSynthesis.speak(u)}
function say(i){speak(lessons[current].lines[i][2])}
function sayWord(button,word){if(!word)return;document.querySelectorAll('.word.playing').forEach(x=>x.classList.remove('playing'));button.classList.add('playing');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.62;u.onend=()=>button.classList.remove('playing');speechSynthesis.speak(u)}
function startReview(){const h=history();const record=h.find(x=>x.reviewDate<=today()&&!x.reviewed);if(!record)return;current=record.lesson;record.reviewed=true;localStorage.setItem('dailyEnglishHistory',JSON.stringify(h));render();window.scrollTo({top:document.querySelector('.dialogue').offsetTop-12,behavior:'smooth'})}
$('#translation').onclick=()=>{showChinese=!showChinese;render()};$('#modeBtn').onclick=()=>{recallMode=!recallMode;render()};
$('#doneBtn').onclick=()=>{let h=history();if(!h.some(x=>x.lesson===current&&x.doneDate===today())){let d=new Date();d.setDate(d.getDate()+1);h.push({lesson:current,doneDate:today(),reviewDate:d.toISOString().slice(0,10),reviewed:false});localStorage.setItem('dailyEnglishHistory',JSON.stringify(h))}render()};
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
